# 服务端口
server:
  port: 8080
  servlet:
    context-path: /rag

spring:
  application:
    name: rag-demo

# 自定义业务配置：大模型、向量接口地址
rag:
  embedding:
    api-url: "https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings"
    api-key: "sk-****"
  llm:
    api-url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
    api-key: "sk-****"
  chunk:
    size: 100
    overlap: 20

# 日志
logging:
  level:
    root: INFO
    com.rag: DEBUG